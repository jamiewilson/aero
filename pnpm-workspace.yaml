packages:
  - 'packages/*'
  - 'packages/create/templates/*'
  - 'examples/*'
  - 'examples/import-bundling/*'
  - 'examples/integrations/*'
  - 'website'

catalog:
  '@types/node': ^26.0.1
  nitro: 3.0.260610-beta
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  '@vitest/ui': 5.0.5
  vite-plus: 1.3.0
overrides:
  js-yaml: ^3.15.0
  nf3: 0.4.2
  '@aero-js/prettier-plugin-aero': 'workspace:*'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
